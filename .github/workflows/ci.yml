name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run check
      - run: npm test
      - run: npm run test:performance
      - run: npm run audit

  desktop-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: node -e "require('electron')"
      - run: node -e "if (process.arch !== 'arm64') throw new Error('Expected arm64 macOS runner')"
      - run: node --test test/desktop-packaging.test.mjs test/electron-preload-runtime-contract.test.mjs
        env:
          MOSA_ELECTRON_PRELOAD_SMOKE: "1"
      - run: npm run test:e2e
      - run: npm run desktop:package
      - run: codesign --verify --deep --strict --verbose=2 out/MOSA-darwin-arm64/MOSA.app
      - run: npm run qa:packaged:smoke

  release-macos-artifact:
    if: github.event_name == 'pull_request' && github.head_ref == 'ci/temp-rc7-macos-artifact-20260911'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run desktop:make
      - uses: actions/upload-artifact@v4
        with:
          name: MOSA-darwin-arm64-0.2.1-rc.7
          path: out/make/dmg/darwin/arm64/MOSA-darwin-arm64-0.2.1-rc.7.dmg
          if-no-files-found: error

  desktop-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: node -e "require('electron')"
      - run: node -e "if (process.arch !== 'x64') throw new Error('Expected x64 Windows runner')"
      - run: node --test test/desktop-packaging.test.mjs test/desktop-platform-adapter.test.mjs test/desktop-runtime-paths.test.mjs test/electron-preload-runtime-contract.test.mjs test/path-safety.test.mjs test/source-locations.test.mjs
        env:
          MOSA_ELECTRON_PRELOAD_SMOKE: "1"
      - run: npm run test:e2e
      - run: npm run desktop:package:windows
      - run: npm run qa:packaged:smoke
