<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <style>
      /* F-21：独立文档（非 Host 注入），:root 安全；名称与主应用语义对应。 */
      :root {
        --mosa-text: #0f172a;
        --mosa-border: #f1f5f9;
        --mosa-accent: #1d4ed8;
        --mosa-focus-ring: #2424ff;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --mosa-text: #f8fafc;
          --mosa-border: #334155;
          --mosa-accent: #5c5cff;
          --mosa-focus-ring: #5c5cff;
        }
      }
      body {
        font: 13px/1.4 system-ui, sans-serif;
        margin: 12px;
        width: 280px;
        color: var(--mosa-text);
      }
      a { color: var(--mosa-accent); }
      a:focus-visible {
        outline: 2px solid var(--mosa-focus-ring);
        outline-offset: 2px;
      }
      code {
        font-size: 12px;
        background: var(--mosa-border);
        padding: 1px 4px;
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <strong>MOSA ChatGPT Capture 0.7</strong>
    <p>默认<strong>自动入库</strong>。右下角面板：</p>
    <ul>
      <li><b>保存当前图</b> / <b>保存全部大图</b></li>
      <li><b>切换自动</b></li>
    </ul>
    <p>状态应显示 <code>hook✓</code>。改代码后请在扩展页点刷新，并硬刷新 ChatGPT。</p>
    <p><a href="options.html" target="_blank">打开设置</a></p>
  </body>
</html>
